<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kunci Pintar</title>
    
    <!-- Pustaka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #007bff;
            --text-dark: #333;
            --text-muted: #777;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; color: #2c3e50; }
        .btn-refresh {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-refresh:hover { background-color: #0056b3; }
        
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .card h2 { margin-top: 0; color: #34495e; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: #f8f9fa; font-weight: 600; }
        tr:hover { background-color: #f1f1f1; }
        
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-ada { background-color: #d4edda; color: #155724; }
        .badge-diambil { background-color: #f8d7da; color: #721c24; }
        
        .loading { text-align: center; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dashboard Kunci Pintar</h1>
        <button class="btn-refresh" onclick="muatData()">Muat Semula Data</button>
    </div>

    <!-- SEKSYEN STATUS KUNCI -->
    <div class="card">
        <h2>Senarai Kunci</h2>
        <table id="table-keys">
            <thead>
                <tr>
                    <th>Nama Kunci</th>
                    <th>Status</th>
                    <th>Peminjam Semasa</th>
                    <th>Terakhir Dikemaskini</th>
                </tr>
            </thead>
            <tbody id="tbody-keys">
                <tr><td colspan="4" class="loading">Memuatkan data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- SEKSYEN SEJARAH (LOG) -->
    <div class="card">
        <h2>Sejarah Pergerakan Terkini</h2>
        <table id="table-history">
            <thead>
                <tr>
                    <th>Tarikh & Masa</th>
                    <th>Pengguna</th>
                    <th>Kunci</th>
                    <th>Tindakan</th>
                </tr>
            </thead>
            <tbody id="tbody-history">
                <tr><td colspan="4" class="loading">Memuatkan data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // =========================================================================
    // 1. KONFIGURASI SUPABASE (TUKAR URL DAN KEY DI SINI)
    // =========================================================================
    const supabaseUrl = 'https://acbuklkczqynzleetdck.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjYnVrbGtjenF5bnpsZWV0ZGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODU5MzgsImV4cCI6MjEwMDQ2MTkzOH0.wiByswtk4qG0pO-QjACGQqFwnwPZakaLqbxmNVKMrGU';
    
    // Inisialisasi Supabase Client
    const { createClient } = supabase;
    const client = createClient(supabaseUrl, supabaseKey);

    // Fungsi Format Tarikh (Supaya kemas ikut waktu Malaysia)
    function formatTarikh(tarikhISO) {
        const date = new Date(tarikhISO);
        return date.toLocaleString('ms-MY', { 
            day: '2-digit', month: 'short', year: 'numeric', 
            hour: '2-digit', minute: '2-digit', second: '2-digit' 
        });
    }

    // =========================================================================
    // 2. FUNGSI AMBIL DATA KUNCI
    // =========================================================================
    async function muatKunci() {
        // Ambil data kunci dan nama penuh peminjam dari jadual users (relational JOIN)
        const { data, error } = await client
            .from('keys')
            .select(`
                key_name, 
                status, 
                updated_at, 
                users (fullname)
            `);

        const tbody = document.getElementById('tbody-keys');
        tbody.innerHTML = '';

        if (error) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:red">Ralat: ${error.message}</td></tr>`;
            return;
        }

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="loading">Tiada data kunci dijumpai.</td></tr>`;
            return;
        }

        data.forEach(kunci => {
            let badgeClass = kunci.status === 'ADA' ? 'badge-ada' : 'badge-diambil';
            let namaPeminjam = kunci.users ? kunci.users.fullname : '- Tiada -';
            
            let row = `<tr>
                <td><strong>${kunci.key_name}</strong></td>
                <td><span class="badge ${badgeClass}">${kunci.status}</span></td>
                <td>${namaPeminjam}</td>
                <td>${formatTarikh(kunci.updated_at)}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // =========================================================================
    // 3. FUNGSI AMBIL DATA SEJARAH
    // =========================================================================
    async function muatSejarah() {
        // Ambil sejarah berserta nama user dan nama kunci, susun ikut paling baru
        const { data, error } = await client
            .from('history')
            .select(`
                action, 
                created_at, 
                users (fullname), 
                keys (key_name)
            `)
            .order('created_at', { ascending: false })
            .limit(20); // Hanya tunjuk 20 rekod terkini

        const tbody = document.getElementById('tbody-history');
        tbody.innerHTML = '';

        if (error) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:red">Ralat: ${error.message}</td></tr>`;
            return;
        }

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="loading">Tiada rekod sejarah.</td></tr>`;
            return;
        }

        data.forEach(log => {
            let namaPeminjam = log.users ? log.users.fullname : 'PENGGUNA TIDAK SAH';
            let namaKunci = log.keys ? log.keys.key_name : '-';
            
            let row = `<tr>
                <td>${formatTarikh(log.created_at)}</td>
                <td><strong>${namaPeminjam}</strong></td>
                <td>${namaKunci}</td>
                <td>${log.action}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // Fungsi Gabungan untuk muat kedua-dua jadual
    function muatData() {
        document.getElementById('tbody-keys').innerHTML = `<tr><td colspan="4" class="loading">Memuatkan data...</td></tr>`;
        document.getElementById('tbody-history').innerHTML = `<tr><td colspan="4" class="loading">Memuatkan data...</td></tr>`;
        muatKunci();
        muatSejarah();
    }

    // Jalankan muat data secara automatik apabila file dibuka
    window.onload = muatData;
    
    // Auto-refresh setiap 10 saat (Boleh buang jika tidak mahu)
    setInterval(muatData, 10000); 

</script>
</body>
</html>
